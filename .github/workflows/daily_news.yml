name: Daily News Push

on:
  schedule:
    # 每天香港時間 08:00 自動發送 (對應 UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許你隨時手動按按鈕測試

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: pip install feedparser requests

      - name: 執行新聞推送腳本
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python news_bot.py
